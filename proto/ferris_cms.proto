syntax = "proto3";

package ferris_cms;

message Empty {}

message Workflow {
    string id = 1;
    string created_at = 2;
    string updated_at = 3;
    bool active = 4;
    string definition_json = 5;
    optional string description = 6;
    string name = 7;
    int64 version = 8;
    
}

message CreateWorkflowRequest {
    bool active = 1;
    string definition_json = 2;
    optional string description = 3;
    string name = 4;
    int64 version = 5;
    
}

message UpdateWorkflowRequest {
    string id = 1;
    reserved 2, 3;
    bool active = 4;
    string definition_json = 5;
    optional string description = 6;
    string name = 7;
    int64 version = 8;
    
}

message GetWorkflowRequest {
  string id = 1;
}

message DeleteWorkflowRequest {
  string id = 1;
}

message ListWorkflowsRequest {
  int32 page_size = 1;
  // Offset of the first item, as returned in next_page_token; empty for the first page.
  string page_token = 2;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  string next_page_token = 2;
}

service WorkflowService {
  rpc Create(CreateWorkflowRequest) returns (Workflow);
  rpc Get(GetWorkflowRequest) returns (Workflow);
  rpc Update(UpdateWorkflowRequest) returns (Workflow);
  rpc Delete(DeleteWorkflowRequest) returns (Empty);
  rpc List(ListWorkflowsRequest) returns (ListWorkflowsResponse);
}
