syntax = "proto3";

package entities.v1;

// Generic CRUD transport used by the generated editor. The payload and body
// are JSON so the transport can carry the canonical OWS document without
// duplicating the OWS schema in protobuf messages.
message EntityRequest {
  string entity = 1;
  string operation = 2;
  string id = 3;
  string payload_json = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message EntityResponse {
  string body_json = 1;
  uint64 total = 2;
}

service EntityService {
  rpc Execute(EntityRequest) returns (EntityResponse);
}
